<h1>guess number</h1>
<input id="num" type="number" placeholder="num">
<button onclick="res()">check</button>
<p id="para">
    youa are wrong / right
</p>
<p id="score">Score</p>

<script>
    var num1 = document.getElementById("num")
    var para = document.getElementById("para")
    var score = document.getElementById("score")
    var totalsc = 10
    function res() {
        var a = Math.floor(Math.random() * 10) + 1
        var enter = num1.value
        if (a ===enter) {
            para.textContent = "right"
            alert("correct")
        } else {
            if(totalsc!=0){
            totalsc = totalsc - 1
            score.textContent ="score "+  totalsc
            para.textContent = "wrong"
            }else{
                score.textContent="gameover restart"
            }
        }
    }
</script>
