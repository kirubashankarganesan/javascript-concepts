1. querySelector
<div class="one">
    <h1 class="ok">hi</h1>
    <h1 class="ok">bye</h1>
</div>
<script>
var div1=document.getElementById("one")//null in console
var div2=document.querySelector("one")//null in console
var div3=document.querySelector(".one")//display tag in console   
// . for class and # for id
console.log(div1);
var div4=document.querySelector("h1")
console.log(div4);// display the first selector only
var div5=document.querySelector(".ok")// same class name then first class is display
</script>
